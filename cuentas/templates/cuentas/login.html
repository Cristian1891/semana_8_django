{% extends "posts/base.html" %}

{% block title %}Ingresar | Mi Blog{% endblock %}

{% block content %}
<section class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h1 class="h2 mb-3">Ingresar</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Ingresar</button>
            {% comment %} <a class="btn btn-outline-secondary" href="{% url 'registro' %}">
                Registrarse
            </a> {% endcomment %}
        </form>
    </div>
</section>
{% endblock %}
