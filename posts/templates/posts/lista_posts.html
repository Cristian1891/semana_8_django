{% extends "posts/base.html" %}

{% block title %}Posts | Mi Blog{% endblock %}

{% block content %}
    <h2>Listado de posts</h2>
    <ul class="post-list">
        {% for post in posts %}
            <li>
                <a href="{% url 'detalle_post' post.id %}">{{ post.titulo }}</a>
                <span>por {{ post.autor }}</span>
            </li>
        {% empty %}
            <li>No hay posts para mostrar.</li>
        {% endfor %}
    </ul>
{% endblock %}
