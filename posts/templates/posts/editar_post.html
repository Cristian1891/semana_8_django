{% extends "posts/base.html" %}

{% block title %}Editar post | Mi Blog{% endblock %}

{% block content %}
<section class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h1 class="h2 mb-3">Editar {{ posteo.titulo }}</h1>

        <form method="post"
              enctype="multipart/form-data"
              novalidate>
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                Guardar cambios
            </button>
            <a class="btn btn-outline-secondary"
               href="{% url 'detalle_post' posteo.slug %}">
                Cancelar
            </a>
        </form>
    </div>
</section>
{% endblock %}
