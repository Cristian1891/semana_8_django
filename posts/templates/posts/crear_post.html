{% extends "posts/base.html" %}

{% block title %}Crear post | Mi Blog{% endblock %}

{% block content %}
<section class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h1 class="h2 mb-3">Crear un post</h1>

        <form method="post" novalidate>
            {% csrf_token %} 
            {{ form.non_field_errors }}
            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">Guardar post</button>
            <a class="btn btn-outline-secondary"
               href="{% url 'lista_posts' %}">Cancelar</a>
        </form>
    </div>
</section>
{% endblock %}



<p>
  <label for="id_titulo">Titulo:</label>
  <input type="text" name="titulo" maxlength="200" required id="id_titulo">
</p>
<p>
  <label for="id_autor">Autor:</label>
  <input type="text" name="autor" maxlength="75" required id="id_autor">
</p>
<p>
  <label for="id_contenido">Contenido:</label>
  <textarea name="contenido" required id="id_contenido"></textarea>
</p>
