{% extends "posts/base.html" %}

{% block title %}{{ posteo.titulo }} | Mi Blog{% endblock %}

{% block content %}
    <article class="post-detail">
        <h2>{{ posteo.titulo }}</h2>
        <p><strong>Autor:</strong> {{ posteo.autor }}</p>
        <p>{{ posteo.contenido }}</p>
    </article>

    <a href="{% url 'lista_posts' %}">Volver al listado</a>
{% endblock %}
