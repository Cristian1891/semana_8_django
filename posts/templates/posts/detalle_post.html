{% extends "posts/base.html" %}

{% block title %}{{ posteo.titulo }} | Mi Blog{% endblock %}

{% block content %}
<article class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h1>{{ posteo.titulo }}</h1>
        <p class="text-body-secondary">
            <strong>Autor</strong> {{ posteo.autor }}
        </p>
        <p>{{ posteo.contenido|linebreaks }}</p>
        <a class="btn btn-outline-secondary"
           href="{% url 'lista_posts' %}">Volver al listado</a>
    </div>
</article>
{% endblock %}
