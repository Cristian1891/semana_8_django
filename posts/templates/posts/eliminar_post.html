{% extends "posts/base.html" %}

{% block title %}Eliminar post | Mi Blog{% endblock %}

{% block content %}
<section class="card border-danger shadow-sm">
    <div class="card-body p-4">
        <h1 class="h2 text-danger">Confirmar eliminación</h1>
        <p>
            ¿Estás seguro de que querés eliminar este posteo?
            <strong>{{ posteo.titulo }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">
                Sí eliminar
            </button>
            <a class="btn btn-outline-secondary"
               href="{% url 'detalle_post' posteo.slug %}">
                Cancelar
            </a>
        </form>
    </div>
</section>
{% endblock %}
